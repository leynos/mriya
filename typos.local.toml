# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
ignore = [
  # Cargo JSON uses this exact external protocol identifier, quoted or in a code span.
  '\bcompiler-artifact\b',
  # `mold` is the linker's name, not a misspelling of `mould`. Exempt only the
  # backticked name, the "mold linker" phrase, the `setup-rust` input
  # `install-mold`, and the `-fuse-ld=mold` linker
  # argument, and the one `contains("mold")` test probe.
  '`mold`',
  # The vendored uv_gate.py lists uv's short flags (-U, -P, -n) as the string
  # "UPn"; the file is byte-for-byte canonical, so exempt that one line.
  '(?m)^FORBIDDEN_SHORT = "UPn"$',
  '\bmold\s+linker\b',
  '\binstall-mold\b',
  '-fuse-ld=mold\b',
  '\.contains\("mold"\)',
  # The linker's own command line and output, its release archive names (with a
  # literal version or a format placeholder), the `bin/mold` path inside them,
  # and the `pinned-mold` stand-in a sandbox test writes.
  '\bcommand -v mold\b',
  '\bmold --version\b',
  '\bmold (?:\{version\}|\{pin\}|\d+\.\d+\.\d+) \(compatible with GNU ld\)',
  '\bmold-(?:\d|\$version|\{VERSION\}|\{\}|<version>)',
  '\bbin/mold\b',
  '\bld\.mold\b',
  '\bpinned-mold\b',
  # The tool name is declared once per language, and only that exact
  # declaration is exempt: a differently named or indented declaration of the
  # same text still reaches the gate, which the spelling contract checks. The
  # `\r?` keeps the anchor exact while tolerating a checkout whose line endings
  # are CRLF, as the declaration patterns below do.
  '(?m)^pub const LINKER_TOOL: &str = "mold";\r?$',
  '(?m)^LINKER_NAME = "mold"\r?$',
  "\\bCARGO_TERM_COLOR\\b",
  "\\borganisation_id\\b",
  "(?m)^    #\\[case\\(\"Café 🚀\", \"caf\"\\)\\]$",
  "(?m)^    types: \\[opened, reopened, synchronize, labeled, ready_for_review\\]$",
  "(?m)^            artifact_suffix: aarch64-apple-darwin$",
  "(?m)^            artifact_suffix: linux-aarch64$",
  "(?m)^            artifact_suffix: linux-x86_64$",
  "(?m)^            artifact_suffix: x86_64-apple-darwin$",
  "(?m)^          path: artifacts$",
  "(?m)^          name: \\$\\{\\{ env\\.REPO_NAME \\}\\}-packages-\\$\\{\\{ matrix\\.artifact_suffix \\}\\}$",
  "(?m)^          name: \\$\\{\\{ env\\.REPO_NAME \\}\\}-packaging-\\$\\{\\{ matrix\\.artifact_suffix \\}\\}$",
  "(?m)^          needs\\.metadata\\.outputs\\.should_upload_workflow_artifacts == 'true'$",
  "(?m)^        \"cached artifact\",$",
  "(?m)^        \\$\\{\\{ steps\\.release_modes\\.outputs\\.should-upload-workflow-artifacts \\}\\}$",
  "(?m)^      should_upload_workflow_artifacts: >-$",
  "(?m)^    if: needs\\.metadata\\.outputs\\.should_upload_workflow_artifacts == 'true'$",
  "(?m)^#\\[tokio::test\\(flavor = \"current_thread\"\\)\\]$",
  # `tests/spelling_contract.rs` judges the exemptions by feeding the gate the
  # misspellings it must still report, so the file cannot itself pass the gate
  # without them. Each reported spelling is written once, on the declaration
  # line anchored below, and every probe interpolates that constant. The rest of
  # the file stays in scope, so a misspelling elsewhere in it is still caught.
  # The `\r?` keeps the anchor exact while tolerating a checkout that has
  # converted the file to CRLF; `(?mR)` would do the same for Typos alone, but
  # the builder validates these patterns with Python's `re`, which has no `R`
  # flag, so the portable form is the one that survives both engines.
  "(?m)^const CARGO_KIND: &str = \"artifact\";\\r?$",
  "(?m)^const LINKER_NAME: &str = \"mold\";\\r?$",
  "(?m)^const RUNTIME_KEY: &str = \"flavor\";\\r?$",
  # The spelling contract declares the letter pair the dictionary reports
  # inside the pinned nightly's hash, so that one declaration line is exempt.
  "(?m)^const COMPILER_HASH: &str = \"ba\";\\r?$",
  # The pinned nightly's compiler hash contains the letter pair "ba"; it is an
  # opaque identifier, not prose.
  '\bac8310ba6\b',
]
