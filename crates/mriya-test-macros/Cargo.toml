# Test-only helper macros. Not published: the root `mriya` crate depends on it
# through a path-only dev-dependency, which `cargo package` strips.
#
# `src/lib.rs` is copied verbatim from leynos/weaver,
# crates/weaver-test-macros/src/lib.rs (last changed in commit
# cc9397eec1921dbfef951bcf4c9f650915c7f4b9; main was
# abc7c3809332cc756a0e9c79021f518d39a02dc7 when copied). Do not edit it; take
# upstream changes by copying again from a recorded revision.
[package]
name = "mriya-test-macros"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
proc-macro = true

[dependencies]
quote = "1.0"
syn = { version = "3.0", features = ["full"] }

[lints]
workspace = true
