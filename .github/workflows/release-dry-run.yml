---
name: Release (dry run)

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      dry-run: true
      publish: false
    # No `secrets: inherit`: this runs for every pull request, and the release
    # workflow reads only GITHUB_TOKEN, which a called workflow receives
    # without being passed anything. Forwarding every secret would put
    # CS_ACCESS_TOKEN in reach of a pull request (CV-005).
