# cargo-mutants configuration. These pattern exclusions complement the
# `exclude-globs: "src/test_support.rs"` input passed by
# .github/workflows/mutation-testing.yml; cargo-mutants merges both.

exclude_re = [
    # Test-only fake-run scaffolding in src/test_backdoors.rs, compiled only
    # under cfg(test) for the binary's unit tests. No Cargo feature enables
    # it, so no production path executes these functions and their mutants are
    # noise (mirrors the existing src/test_support.rs exclusion). These are
    # function-name patterns, not a module exclusion: rename or add a fake-run
    # function here as well.
    "enable_fake_modes",
    "fake_mode_from_env",
    "run_fake_mode",
    "dump_request",
    "prefail_from_env",
    "select_fake_outcome",
    "run_fake_outcome",
    # Equivalent mutant: InstanceRequestBuilder::new() is defined as
    # Self::default(), so replacing the builder body with
    # Default::default() cannot change behaviour.
    'replace InstanceRequest::builder -> InstanceRequestBuilder with Default::default\(\)',
    # Hang-inducing boundary mutant, accepted rather than killed. In
    # forward_stream the EOF check `if read == 0 { break; }` becomes
    # `if read != 0 { break; }`, so the loop never stops at end of file: the
    # reader keeps answering `Ok(0)` and the thread spins for ever. The
    # forwarders are joined with no bound after the child is waited for, and
    # src/sync/tests/streaming.rs drives them through real child processes
    # whose pipes legitimately reach EOF, so the spinning thread holds the
    # process stdout lock and cargo-mutants records TIMEOUT, not CAUGHT. A
    # bounded wait cannot turn that into CAUGHT while the thread holds the
    # lock. The behaviour is covered directly instead, by the controlled
    # readers in src/sync/types/tests.rs, which make the read after EOF fail
    # so the flipped operator returns a Spawn error rather than spinning. No
    # read guard belongs in production: a zero-byte read is legitimate EOF.
    # The pattern is anchored to this file and this function and tolerates
    # only a moved line and column; tests/mutants_config_contract.rs holds it
    # to that scope.
    '^src/sync/types\.rs:[0-9]+:[0-9]+: replace == with != in forward_stream$',
]
